services:
    devcontainer:
        image: ghcr.io/paper9oll/devcontainer-ssh:latest
        container_name: devcontainer
        restart: unless-stopped
        env_file:
            - .env
        ports:
            - '{$SSH_PORT}:22'
        volumes:
            - dev-home:/home/vscode
            - dev-hostkeys:/ssh-host-keys
            - dev-tailscale-state:/var/lib/tailscale
        healthcheck:
            disable: false

volumes:
    dev-home:
    dev-hostkeys:
    dev-tailscale-state:
