name: Build and Publish

on:
  push:
    branches:
      - main
      - dev
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate standard image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=Dev Container SSH
            org.opencontainers.image.description=SSH-enabled Microsoft Dev Container

      - name: Generate Tailscale SSH image metadata
        id: meta-ts
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest-ts,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}-ts,enable=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=Dev Container SSH with Tailscale SSH
            org.opencontainers.image.description=SSH-enabled Microsoft Dev Container with Tailscale SSH

      - name: Build standard test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: latest
          pull: true
          load: true
          platforms: linux/amd64
          tags: devcontainer-ssh:test
          cache-from: type=gha

      - name: Validate standard image
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            devcontainer-ssh:test \
            -c 'test "$(head -c 2 /usr/local/bin/start-ssh)" = "#!" && ssh-keygen -A && /usr/sbin/sshd -t'

      - name: Build Tailscale SSH test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tailscale
          pull: true
          load: true
          platforms: linux/amd64
          tags: devcontainer-ssh:ts-test
          cache-from: type=gha

      - name: Validate Tailscale SSH image
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            devcontainer-ssh:ts-test \
            -c 'test "$(head -c 2 /usr/local/bin/start-ssh-tailscale)" = "#!" && tailscale version && ssh-keygen -A && /usr/sbin/sshd -t'

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish standard image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: latest
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish Tailscale SSH image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tailscale
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-ts.outputs.tags }}
          labels: ${{ steps.meta-ts.outputs.labels }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
